<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sb-brand">
    <svg class="sb-brand-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    <span *ngIf="!isCollapsed">FLEXBIDEYA</span>
    <button class="sb-toggle" (click)="toggleSidebar()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline [attr.points]="isCollapsed ? '13 17 18 12 13 7' : '11 17 6 12 11 7'"/></svg>
    </button>
  </div>
  <div class="sb-sub" *ngIf="!isCollapsed">Dashboard Organisateur</div>

  <div class="sb-section-label">Principal</div>
  <div class="sb-item" [class.active]="currentView === 'overview'" (click)="switchView('overview')">
    <div class="sb-item-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </div>
    <span *ngIf="!isCollapsed">Vue d'ensemble</span>
  </div>

  <div class="sb-section-label" *ngIf="!isCollapsed">Mes Contenus</div>
  <div class="sb-item" [class.active]="currentView === 'startups'" (click)="switchView('startups')">
    <div class="sb-item-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <span *ngIf="!isCollapsed">Mes Startups</span>
    <span class="sb-badge" *ngIf="!isCollapsed">{{ startupCount }}</span>
  </div>
  <div class="sb-item" [class.active]="currentView === 'bmc'" (click)="switchView('bmc')">
    <div class="sb-item-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="9" y2="9"/><line x1="15" y1="9" x2="21" y2="9"/></svg>
    </div>
    <span *ngIf="!isCollapsed">Business Model Canvas</span>
  </div>
  <div class="sb-item" [class.active]="currentView === 'hackathons'" (click)="switchView('hackathons')">
    <div class="sb-item-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </div>
    <span *ngIf="!isCollapsed">Mes Hackathons</span>
    <span class="sb-badge orange" *ngIf="!isCollapsed">10</span>
  </div>
  <div class="sb-item" [class.active]="currentView === 'gagnants'" (click)="switchView('gagnants')">
    <div class="sb-item-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
    </div>
    <span *ngIf="!isCollapsed">Gagnants</span>
    <span class="sb-badge green" *ngIf="!isCollapsed">2</span>
  </div>

  <div class="sb-divider"></div>

  <div class="sb-section-label">Gestion</div>
  <div class="sb-item">
    <div class="sb-item-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2"/><line x1="12" y1="12" x2="12" y2="16"/></svg>
    </div>
    Stands
  </div>
  <div class="sb-item">
    <div class="sb-item-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </div>
    Participants
  </div>

  <div class="sb-divider"></div>

  <div class="sb-section-label">Compte</div>
  <div class="sb-item">
    <div class="sb-item-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
    </div>
    Paramètres
  </div>
  <div class="sb-item">
    <div class="sb-item-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    Déconnexion
  </div>

  <div class="sb-user-bottom">
    <div class="sb-avatar">AM</div>
    <div *ngIf="!isCollapsed">
      <div class="sb-user-name">Ahmed Mansouri</div>
      <div class="sb-user-role">Organisateur</div>
    </div>
  </div>
</aside>
