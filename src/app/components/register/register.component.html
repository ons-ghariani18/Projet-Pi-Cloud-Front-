<div class="register-container">
  <div class="logo">
    <i class="fas fa-bolt"></i> FLEXBIDEYA
  </div>
  <h2>Inscription</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Nom d'utilisateur *</label>
      <input type="text" formControlName="username" class="form-control" />
      <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="error">
        Minimum 3 caractères
      </div>
    </div>

    <div class="form-group">
      <label>Email *</label>
      <input type="email" formControlName="email" class="form-control" />
      <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="error">
        Email valide requis
      </div>
    </div>

    <div class="form-group">
      <label>Téléphone</label>
      <input type="tel" formControlName="tel" class="form-control" />
    </div>

    <div class="form-group">
      <label>Mot de passe *</label>
      <input type="password" formControlName="password" class="form-control" />
      <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="error">
        Minimum 6 caractères
      </div>
    </div>

    <div class="form-group">
      <label>Confirmer le mot de passe *</label>
      <input type="password" formControlName="confirmPassword" class="form-control" />
      <div *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched" class="error">
        Les mots de passe ne correspondent pas
      </div>
    </div>

    <div class="form-group">
      <label>Type de compte *</label>
      <select formControlName="role" class="form-control" (change)="onRoleChange($event)">
        <option value="">-- Sélectionnez --</option>
        <option value="ENTREPRENEUR">Entrepreneur</option>
        <option value="EXPERT">Expert / Mentor</option>
        <option value="ORGANISATEUR">Organisateur (Hackathons / Events)</option>
      </select>
    </div>

    <!-- Champs conditionnels -->
    <div *ngIf="selectedRole === 'ENTREPRENEUR'" class="form-group">
      <label>Description de votre startup *</label>
      <textarea formControlName="startupDescription" rows="3" class="form-control"></textarea>
      <div *ngIf="registerForm.get('startupDescription')?.invalid && registerForm.get('startupDescription')?.touched" class="error">
        Ce champ est requis
      </div>
    </div>

    <div *ngIf="selectedRole === 'EXPERT'" class="form-group">
      <label>Domaine d'expertise *</label>
      <input type="text" formControlName="domaine" class="form-control" />
      <div *ngIf="registerForm.get('domaine')?.invalid && registerForm.get('domaine')?.touched" class="error">
        Ce champ est requis
      </div>
    </div>

    <div *ngIf="selectedRole === 'ORGANISATEUR'" class="form-group">
      <label>Nom de l'organisation *</label>
      <input type="text" formControlName="organisation" class="form-control" />
      <div *ngIf="registerForm.get('organisation')?.invalid && registerForm.get('organisation')?.touched" class="error">
        Ce champ est requis
      </div>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>

    <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid">S'inscrire</button>
  </form>

  <div class="divider">ou</div>
  <button class="btn btn-outline" (click)="router.navigate(['/login'])">Déjà un compte ? Se connecter</button>
</div>
