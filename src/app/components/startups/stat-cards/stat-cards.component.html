<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-icon purple">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <div class="stat-value">{{ totalStartups }}</div>
    <div class="stat-label">Startups total</div>
    <div class="stat-trend up">↑ +1 ce mois</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon orange">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </div>
    <div class="stat-value">12</div>
    <div class="stat-label">Hackathons total</div>
    <div class="stat-trend up">↑ +1 ce mois</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon blue">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <div class="stat-value">{{ pendingStartups }}</div>
    <div class="stat-label">En attente (total)</div>
    <div class="stat-trend neutral">En cours de révision</div>
  </div>
  <div class="stat-card">
    <div class="stat-icon green">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </div>
    <div class="stat-value">8</div>
    <div class="stat-label">Membres équipes</div>
    <div class="stat-trend up">↑ +3 cette semaine</div>
  </div>
</div>
