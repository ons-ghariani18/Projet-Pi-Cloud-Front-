<div class="stats-grid">
  <!-- STARTUPS TOTAL -->
  <div class="stat-card">
    <div class="stat-main">
      <div class="stat-icon purple">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-value">{{ totalStartups }}</div>
        <div class="stat-label">Startups total</div>
      </div>
    </div>
    <div class="stat-footer">
      <div class="stat-trend up">↑ +1 ce mois</div>
      <div class="mini-chart">
        <div class="bar" style="height: 40%"></div>
        <div class="bar" style="height: 60%"></div>
        <div class="bar" style="height: 45%"></div>
        <div class="bar active" style="height: 80%"></div>
      </div>
    </div>
  </div>

  <!-- BUDGET GLOBAL -->
  <div class="stat-card">
    <div class="stat-main">
      <div class="stat-icon orange">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-value">{{ totalBudget | number:'1.0-0' }} TND</div>
        <div class="stat-label">Budget Global</div>
      </div>
    </div>
    <div class="stat-footer">
      <div class="stat-trend up">↑ +15% vs year</div>
      <div class="mini-chart">
        <div class="bar" style="height: 30%"></div>
        <div class="bar" style="height: 50%"></div>
        <div class="bar" style="height: 70%"></div>
        <div class="bar active" style="height: 90%"></div>
      </div>
    </div>
  </div>

  <!-- MRR TOTAL -->
  <div class="stat-card">
    <div class="stat-main">
      <div class="stat-icon green">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-value">{{ totalMRR | number:'1.0-0' }} TND</div>
        <div class="stat-label">MRR Mensuel</div>
      </div>
    </div>
    <div class="stat-footer">
      <div class="stat-trend up">↑ +8% /mois</div>
      <div class="mini-chart-line">
        <svg width="60" height="20" viewBox="0 0 60 20">
          <path d="M0 15 Q 15 5, 30 12 T 60 2" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- BMC STATUS -->
  <div class="stat-card" (click)="navigateToBmc()">
    <div class="stat-main">
      <div class="stat-icon blue">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-value" *ngIf="isBmcComplete">Complet</div>
        <div class="stat-value" *ngIf="!isBmcComplete">{{ bmcPercentage }}%</div>
        <div class="stat-label">Statut BMC</div>
      </div>
    </div>
    <div class="stat-footer">
      <div class="badge-bmc complete" *ngIf="isBmcComplete">🎉 Prêt pour pitch</div>
      <div class="badge-bmc incomplete" *ngIf="!isBmcComplete">⚠️ À finaliser</div>
      <div class="progress-circle">
        <svg width="30" height="30" viewBox="0 0 36 36">
          <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#e2e8f0" stroke-width="3"/>
          <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#3b82f6" stroke-width="3" [attr.stroke-dasharray]="bmcPercentage + ', 100'"/>
        </svg>
      </div>
    </div>
  </div>
</div>
