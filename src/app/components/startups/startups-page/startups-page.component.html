<div class="page-wrapper">
  
  <app-sidebar></app-sidebar>

  <div class="content-container">
    <app-topnav></app-topnav>

    <div class="main-content">
      <!-- GREETING -->
      <div class="greeting">
        <h2>Bonjour, {{ currentUsername }} <span>👋</span></h2>
        <p>Voici un résumé de votre activité aujourd'hui</p>
      </div>

      <div class="tabs">
        <button class="tab-btn" [class.active]="activeTab === 'startups'" (click)="setTab('startups')">Vue startups</button>
        <button class="tab-btn" [class.active]="activeTab === 'performance'" (click)="setTab('performance')">Performance membres</button>
      </div>

      <ng-container *ngIf="activeTab === 'startups'">
        <!-- STATS -->
        <app-stat-cards></app-stat-cards>

        <!-- RECENT STARTUPS -->
        <div class="section-header">
          <div>
            <h3>Startups récentes</h3>
            <p>Aperçu rapide de vos startups</p>
          </div>
          <button class="btn-new" (click)="addModal.open()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nouvelle startup
          </button>
        </div>

        <app-startup-cards (edit)="onOpenEditModal($event)"></app-startup-cards>

        <!-- MANAGEMENT TABLE -->
        <div class="section-header" style="margin-top:8px">
          <div>
            <h3>Gestion des Startups</h3>
            <p>Approuvez, rejetez ou remettez en attente les startups</p>
          </div>
        </div>

        <app-startup-table (updateStatus)="onOpenStatusModal($event)" (edit)="onOpenEditModal($event)"></app-startup-table>
      </ng-container>

      <ng-container *ngIf="activeTab === 'performance'">
        <div class="section-header">
          <div>
            <h3>Performance membres</h3>
            <p>Mesure de l'engagement et de la qualité des contributions BMC</p>
          </div>
          <select class="startup-select" [(ngModel)]="selectedStartupId">
            <option [ngValue]="null">Sélectionner startup</option>
            <option *ngFor="let s of myStartups" [ngValue]="s.id">{{ s.nom }}</option>
          </select>
        </div>
        <app-membre-performance [startupId]="selectedStartupId"></app-membre-performance>
      </ng-container>

    </div><!-- end main-content -->
  </div><!-- end content-container -->
</div><!-- end page-wrapper -->

<!-- MODALS -->
<app-add-startup-modal #addModal></app-add-startup-modal>
<app-status-modal #statusModal></app-status-modal>
<app-edit-startup-modal [startup]="selectedStartupToEdit" (closed)="onCloseEditModal()"></app-edit-startup-modal>
<app-toast></app-toast>
