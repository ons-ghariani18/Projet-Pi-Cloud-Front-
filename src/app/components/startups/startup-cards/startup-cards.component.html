<div class="startup-cards">
  <div class="startup-card" *ngFor="let s of recentStartups; let i = index">
    <div class="sc-banner" [ngClass]="banners[i % banners.length]">
      <span>{{ s.nom ? s.nom.split(' ')[0] : '' }}</span>
    </div>
    <div class="sc-body">
      <div class="sc-badge" [ngClass]="s.status">{{ s.status === 'approved' ? 'Approuvée' : (s.status === 'pending' ? 'En attente' : 'Rejetée') }}</div>
      <div class="sc-name">{{ s.nom }}</div>
      <div class="sc-meta">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        {{ s.sub }}
      </div>
    </div>
    <div class="sc-footer">
      <div class="sc-dates">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        {{ s.dates ? s.dates.replace('\n', ' ') : '' }}
      </div>
    </div>
  </div>
</div>
