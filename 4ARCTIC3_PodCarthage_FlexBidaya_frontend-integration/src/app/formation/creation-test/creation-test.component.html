<div class="premium-creation-container">
  <div class="glass-card fade-in">
    <div class="header-section">
      <img src="assets/logo.png" alt="FlexBidaya" class="header-logo" />
      <div>
        <h1>Final Exam Configuration</h1>
        <p>Set the certification parameters for your course.</p>
      </div>
    </div>

    <!-- Messages -->
    <div *ngIf="msgSuccess" style="background:rgba(16,185,129,0.15);border:1px solid #10b981;color:#10b981;padding:14px 18px;border-radius:10px;margin-bottom:20px;font-weight:600;">
      {{ msgSuccess }}
    </div>
    <div *ngIf="msgError" style="background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#ef4444;padding:14px 18px;border-radius:10px;margin-bottom:20px;font-weight:600;">
      {{ msgError }}
    </div>

    <!-- Loading state -->
    <div *ngIf="isLoadingFormations" style="text-align:center;padding:20px;color:#94a3b8;">
      ⏳ Loading your courses...
    </div>

    <!-- No formations state -->
    <div *ngIf="!isLoadingFormations && formations.length === 0" style="text-align:center;padding:30px;color:#94a3b8;">
      <p style="font-size:1.1rem;">📚 You have no courses yet.</p>
      <button class="btn-ghost" routerLink="/mentor" style="margin-top:10px;">← Go back and create a course first</button>
    </div>

    <form *ngIf="!isLoadingFormations && formations.length > 0"
          [formGroup]="testForm" (ngSubmit)="soumettre()" class="creation-form">

      <!-- Formation selector -->
      <div class="form-grid" style="grid-template-columns: 1fr;">
        <div class="field" style="width: 100%;">
          <label>📚 Link to Your Course <span style="color:#ef4444">*</span></label>
          <select formControlName="formationId" class="input-modern" style="width: 100%;">
            <option value="">-- Select a course --</option>
            <option *ngFor="let f of formations" [value]="f.id">
              {{ f.titre }}
              <ng-container *ngIf="f.statut"> ({{ f.statut === 'APPROUVEE' ? '✅ Approved' : f.statut === 'EN_ATTENTE' ? '⏳ Pending' : '❌ Rejected' }})</ng-container>
            </option>
          </select>
          <small *ngIf="testForm.get('formationId')?.invalid && testForm.get('formationId')?.touched"
                 style="color:#ef4444;font-size:12px;">Please select a course.</small>
        </div>
      </div>

      <!-- Exam settings -->
      <div class="form-grid" style="margin-top: 15px;">
        <div class="field">
          <label>📅 Exam Date and Time <span style="color:#ef4444">*</span></label>
          <input type="datetime-local" formControlName="heureFixeDebut" class="input-modern">
          <small *ngIf="testForm.get('heureFixeDebut')?.invalid && testForm.get('heureFixeDebut')?.touched"
                 style="color:#ef4444;font-size:12px;">Please pick a date.</small>
        </div>
        <div class="field">
          <label>⏱ Duration (Minutes) <span style="color:#ef4444">*</span></label>
          <input type="number" formControlName="dureeMinutes" class="input-modern" placeholder="e.g. 60">
        </div>
        <div class="field">
          <label>🎯 Passing Threshold (Points) <span style="color:#ef4444">*</span></label>
          <input type="number" formControlName="scoreSeuil" class="input-modern" placeholder="e.g. 50">
        </div>
      </div>

      <!-- Questions -->
      <div class="questions-section">
        <div class="qs-header">
          <h3>📝 Questions ({{ questions.length }})</h3>
          <button type="button" class="btn-tool" (click)="ajouterQuestion()">+ Add Question</button>
        </div>

        <div formArrayName="questions" class="questions-list">
          <div *ngFor="let q of questions.controls; let i=index" [formGroupName]="i" class="q-form-card glass">
            <div class="q-form-header">
              <span class="q-number">Question {{ i + 1 }}</span>
              <button type="button" class="btn-delete" (click)="supprimerQuestion(i)">🗑️</button>
            </div>

            <div class="q-form-body">
              <div class="field">
                <label>Question Type</label>
                <select formControlName="type" class="input-modern">
                  <option value="QCM">Multiple Choice (Auto Grading)</option>
                  <option value="OUVERTE">Open Ended (Mentor Grading)</option>
                </select>
              </div>

              <div class="field">
                <label>Question Text <span style="color:#ef4444">*</span></label>
                <input formControlName="texte" class="input-modern" placeholder="Enter your question...">
                <small *ngIf="q.get('texte')?.invalid && q.get('texte')?.touched"
                       style="color:#ef4444;font-size:12px;">Required.</small>
              </div>

              <div class="field">
                <label>Points</label>
                <input type="number" formControlName="points" class="input-modern short" min="1">
              </div>

              <!-- QCM ONLY -->
              <div *ngIf="q.get('type')?.value === 'QCM'" class="qcm-options fade-in">
                <div class="options-grid">
                  <div class="field"><label>A</label><input formControlName="choixA" class="input-modern"></div>
                  <div class="field"><label>B</label><input formControlName="choixB" class="input-modern"></div>
                  <div class="field"><label>C</label><input formControlName="choixC" class="input-modern"></div>
                  <div class="field"><label>D</label><input formControlName="choixD" class="input-modern"></div>
                </div>
                <div class="field" style="margin-top: 15px;">
                  <label>✅ Correct Answer</label>
                  <select formControlName="bonneReponse" class="input-modern short">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="btn-ghost" routerLink="/mentor">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">🚀 Save and Publish Exam</span>
          <span *ngIf="isSubmitting">⏳ Creating...</span>
        </button>
      </div>
    </form>
  </div>
</div>
