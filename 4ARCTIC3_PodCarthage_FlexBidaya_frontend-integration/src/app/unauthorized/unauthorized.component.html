<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;
            background:linear-gradient(135deg,#0a1628,#0d1f3c,#1a1040);">
  <div style="text-align:center;padding:3rem;max-width:480px;">

    <div style="width:100px;height:100px;border-radius:50%;
                background:rgba(239,68,68,0.15);border:2px solid rgba(239,68,68,0.4);
                display:flex;align-items:center;justify-content:center;margin:0 auto 2rem;">
      <i class="fas fa-ban" style="font-size:2.5rem;color:#ef4444;"></i>
    </div>

    <div style="font-size:11px;font-weight:900;letter-spacing:3px;
                color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:1rem;">
      ⚡ FLEXBIDEYA
    </div>

    <h1 style="font-size:1.8rem;font-weight:800;color:#fff;margin-bottom:0.75rem;">
      Accès non autorisé
    </h1>

    <p style="font-size:0.9rem;color:rgba(255,255,255,0.45);line-height:1.6;margin-bottom:2rem;">
      Vous n'avez pas les permissions nécessaires pour accéder à cette page.
      Cette section est réservée à un autre type de compte.
    </p>

    <div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);
                border-radius:12px;padding:1rem 1.25rem;margin-bottom:2rem;text-align:left;">
      <div style="font-size:0.78rem;color:rgba(255,255,255,0.5);line-height:1.6;">
        <i class="fas fa-info-circle" style="color:#ef4444;margin-right:6px;"></i>
        Votre rôle actuel : <strong style="color:#ef4444;">{{ currentRole }}</strong>
      </div>
    </div>

    <button (click)="goToDashboard()"
            style="width:100%;padding:0.9rem;border-radius:12px;border:none;
                   cursor:pointer;font-weight:700;font-size:0.95rem;color:#fff;
                   background:linear-gradient(135deg,#8b5cf6,#6d28d9);">
      <i class="fas fa-home" style="margin-right:0.5rem;"></i>
      Retourner à mon tableau de bord
    </button>

  </div>
</div>
