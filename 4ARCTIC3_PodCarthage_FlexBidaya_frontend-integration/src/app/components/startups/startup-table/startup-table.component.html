<div class="table-card">

  <table>
    <thead>
      <tr>
        <th>Startup</th>
        <th>Sector</th>
        <th>Dates</th>
        <th *ngIf="isAdmin">Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of filteredStartups; let i = index">
        <td>
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bmc-completion-badge" [ngClass]="getBmcBadgeClass(bmcCompletionMap[s.id || 0])">
              <span class="pct">{{ bmcCompletionMap[s.id || 0] || 0 }}%</span>
              <span class="lbl">BMC</span>
            </div>
            <div>
              <div class="td-startup">{{ s.nom }}</div>
              <div class="td-sub">{{ s.sub }}</div>
            </div>
          </div>
        </td>
        <td><span class="td-sector">{{ s.secteur }}</span></td>
        <td style="font-size:13px;color:var(--muted2)" [innerHTML]="s.dates ? s.dates.replace('\n', '<br>') : ''"></td>
        
        <!-- Status for Admin -->
        <td *ngIf="isAdmin">
          <span class="status-pill" [ngClass]="{
            'approved': s.status === 'approved',
            'pending': s.status === 'pending',
            'rejected': s.status === 'rejected'
          }">
            {{ s.status === 'approved' ? 'Approved' : (s.status === 'rejected' ? 'Rejected' : 'Pending') }}
          </span>
        </td>

        <td class="td-actions">
          <div class="actions-group">
            <!-- Admin Specific: Approve / Reject -->
            <ng-container *ngIf="isAdmin">
              <button *ngIf="s.status !== 'approved'" class="btn-action-outline" (click)="updateStatus(s.id, 'approved')" title="Approve" style="color: #059669; border-color: #10b981;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
              <button *ngIf="s.status !== 'rejected'" class="btn-action-outline" (click)="updateStatus(s.id, 'rejected')" title="Reject" style="color: #dc2626; border-color: #ef4444;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </ng-container>

            <button class="btn-action-outline edit" (click)="onEdit(s)" title="Edit">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="btn-action-outline delete" (click)="onDelete(s.id)" title="Delete">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
            <button class="btn-action-outline growth" (click)="onViewGrowth(s)" title="Growth Charts" style="color: #10b981; border-color: #bbf7d0; background: #f0fdf4;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            </button>
            <button class="btn-action details" (click)="onViewDetails(s)" style="background: #8b5cf6; color: white;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              Details
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
