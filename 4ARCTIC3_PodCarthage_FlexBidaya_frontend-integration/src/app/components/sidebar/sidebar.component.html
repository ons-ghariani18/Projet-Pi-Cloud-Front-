<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sb-brand">
    <div class="brand-logo">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <span *ngIf="!isCollapsed">FLEXBIDAYA</span>
    </div>
    <button class="sb-toggle" (click)="toggleSidebar()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline [attr.points]="isCollapsed ? '13 17 18 12 13 7' : '11 17 6 12 11 7'"/></svg>
    </button>
  </div>
  <div class="sb-sub" *ngIf="!isCollapsed">Startup Dashboard</div>

  <div class="sidebar-nav">
    <div class="sb-section-label" *ngIf="!isCollapsed">Main</div>
    <a class="sb-item" [class.active]="currentView === 'overview'" (click)="switchView('overview')">
      <div class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </div>
      <span *ngIf="!isCollapsed">Overview</span>
    </a>

    <div class="sb-section-label" *ngIf="!isCollapsed">Content</div>
    <a class="sb-item" [class.active]="currentView === 'startups'" (click)="switchView('startups')">
      <div class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <span *ngIf="!isCollapsed">My Startups</span>
      <span class="sb-badge" *ngIf="!isCollapsed">{{ startupCount }}</span>
    </a>
    <a class="sb-item" [class.active]="currentView === 'bmc'" (click)="switchView('bmc')">
      <div class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="9" y2="9"/><line x1="15" y1="9" x2="21" y2="9"/></svg>
      </div>
      <span *ngIf="!isCollapsed">Business Model</span>
    </a>

    <div class="sb-divider"></div>

    <div class="sb-section-label" *ngIf="!isCollapsed">Social</div>
    <a class="sb-item" [class.active]="currentView === 'dashboard'" (click)="switchView('dashboard')">
      <div class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
      </div>
      <span *ngIf="!isCollapsed">Fil d'actualité</span>
    </a>

    <div class="sb-divider"></div>

    <div class="sb-section-label" *ngIf="!isCollapsed">Account</div>
    <a class="sb-item">
      <div class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      </div>
      <span *ngIf="!isCollapsed">Settings</span>
    </a>
    <a class="sb-item" (click)="switchView('logout')">
      <div class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <span *ngIf="!isCollapsed">Logout</span>
    </a>
  </div>

  <div class="sb-user-bottom">
      <div class="sb-avatar">{{ currentUsername.charAt(0).toUpperCase() }}</div>
      <div class="sb-user-info" *ngIf="!isCollapsed">
        <div class="sb-user-name">{{ currentUsername }}</div>
        <div class="sb-user-role">{{ currentUserRole }}</div>
      </div>
  </div>
</aside>
