<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-title">
        <span class="icon">💱</span>
        <h3>Convertisseur EUR / TND</h3>
      </div>
      <button class="btn-close" (click)="onClose()">&times;</button>
    </div>

    <div class="modal-body">
      <div class="loader-container" *ngIf="loading">
        <div class="spinner"></div>
        <p>Récupération du taux...</p>
      </div>

      <div class="error-msg" *ngIf="error && !loading">
        {{ error }}
        <button class="btn-retry" (click)="fetchRate()">Réessayer</button>
      </div>

      <div class="conversion-form" *ngIf="rateData && !loading">
        <div class="rate-info">
          <span class="rate-value">1 EUR = {{ rateData.rate }} TND</span>
          <button class="btn-refresh" (click)="fetchRate()" title="Actualiser le taux">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></svg>
          </button>
        </div>

        <div class="input-group">
          <label>Montant en EUR (€)</label>
          <div class="input-wrapper">
            <input type="number" [(ngModel)]="eurAmount" (ngModelChange)="updateTndFromEur()" placeholder="0.00">
            <span class="currency-tag">EUR</span>
          </div>
        </div>

        <div class="conversion-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10l5 5 5-5M7 14l5-5 5 5"/></svg>
        </div>

        <div class="input-group">
          <label>Montant en TND (DT)</label>
          <div class="input-wrapper">
            <input type="number" [(ngModel)]="tndAmount" (ngModelChange)="updateEurFromTnd()" placeholder="0.00">
            <span class="currency-tag">TND</span>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer" *ngIf="rateData">
      <div class="meta-info">
        <span>Source: {{ rateData.source }}</span>
        <span class="separator">•</span>
        <span>Date: {{ rateData.date }}</span>
      </div>
    </div>
  </div>
</div>
