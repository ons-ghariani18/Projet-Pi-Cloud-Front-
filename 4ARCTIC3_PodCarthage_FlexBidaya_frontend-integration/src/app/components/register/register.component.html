<div class="login-page">
  <!-- SOFT PASTEL SHAPES -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <div class="glass-card">
    <div class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <span>FLEXBIDAYA</span>
    </div>
    
    <div class="header">
      <h1>Registration</h1>
      <p>Create your account to join the adventure</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" formControlName="username" placeholder="Username" />
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" formControlName="email" placeholder="Email" />
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Phone</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <input type="tel" formControlName="tel" placeholder="+216 ..." />
          </div>
        </div>
        <div class="form-group">
          <label>Role</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            <select formControlName="role" (change)="onRoleChange($event)">
              <option value="">-- Select --</option>
              <option value="entrepreneur">Entrepreneur</option>
              <option value="expert">Expert / Mentor</option>
              <option value="organisateur">Organizer</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Specific fields for Roles -->
      <div class="form-group" *ngIf="selectedRole === 'entrepreneur'" style="margin-bottom: 20px;">
        <label>Startup description</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <input type="text" formControlName="startupDescription" placeholder="Tell us about your project..." />
        </div>
      </div>

      <div class="form-group" *ngIf="selectedRole === 'expert'" style="margin-bottom: 20px;">
        <label>Expertise domain</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <input type="text" formControlName="domaine" placeholder="Ex: Marketing, AI, Finance..." />
        </div>
      </div>

      <div class="form-group" *ngIf="selectedRole === 'organisateur'" style="margin-bottom: 20px;">
        <label>Organization Name</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M3 7v1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7H3z"/></svg>
          <input type="text" formControlName="organisation" placeholder="Ex: Technopark, Incubator..." />
        </div>
      </div>


      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" formControlName="password" placeholder="••••••••" />
          </div>
        </div>
        <div class="form-group">
          <label>Confirmation</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <input type="password" formControlName="confirmPassword" placeholder="••••••••" />
          </div>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="success-msg">{{ successMessage }}</div>

      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid">
        Create my account
      </button>
    </form>

    <div class="footer">
      <span>Already registered?</span>
      <a (click)="router.navigate(['/login'])">Login</a>
    </div>
  </div>
</div>
