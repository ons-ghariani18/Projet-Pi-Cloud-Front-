<div class="wrap">
  <div class="topbar">
    <h2>Forum</h2>
    <a routerLink="/logout">Deconnexion</a>
  </div>

  <div class="card create">
    <h3>Creer un sujet</h3>
    <input [(ngModel)]="titre" placeholder="Titre" />
    <textarea [(ngModel)]="contenu" rows="4" placeholder="Contenu"></textarea>
    <button (click)="createPost()">Publier</button>
  </div>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="card post" *ngFor="let p of posts">
    <h4 (click)="openPost(p.id)">{{ p.titre }}</h4>
    <p>{{ p.contenu }}</p>
    <div class="meta">
      <span>Par {{ p.username }}</span>
      <span>{{ p.dateCreation | date:'short' }}</span>
      <button (click)="likePost(p.id)">Like ({{ p.likeCount }})</button>
      <button (click)="openPost(p.id)">Details</button>
    </div>
  </div>
</div>
