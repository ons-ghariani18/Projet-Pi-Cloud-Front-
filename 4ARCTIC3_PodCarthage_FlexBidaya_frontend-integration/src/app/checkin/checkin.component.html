<div style="min-height:100vh;display:flex;align-items:center;
            justify-content:center;background:#060d24;padding:2rem;">

  <!-- CHARGEMENT -->
  <div *ngIf="state === 'loading'" style="text-align:center;color:white;">
    <div style="font-size:3rem;margin-bottom:1rem;">⏳</div>
    <p style="font-size:1.1rem;">Vérification en cours...</p>
  </div>

  <!-- SUCCÈS -->
  <div *ngIf="state === 'success'"
       style="background:white;border-radius:24px;padding:2.5rem;
              text-align:center;max-width:400px;width:100%;
              box-shadow:0 40px 80px rgba(0,0,0,0.4);">
    <div style="font-size:4rem;margin-bottom:1rem;">✅</div>
    <div style="font-size:0.8rem;font-weight:700;color:#059669;
                letter-spacing:2px;text-transform:uppercase;margin-bottom:0.5rem;">
      PRÉSENCE CONFIRMÉE
    </div>
    <h2 style="font-size:1.5rem;font-weight:800;color:#1f2937;margin:0 0 0.5rem;">
      {{ participantName }}
    </h2>
    <p style="font-size:0.85rem;color:#6b7280;margin:0 0 1.5rem;">
      {{ email }}
    </p>
    <div *ngIf="participantSkills"
         style="background:#f0fdf4;border:1px solid #bbf7d0;
                border-radius:12px;padding:0.75rem 1rem;
                font-size:0.8rem;color:#166534;">
      <strong>Compétences :</strong> {{ participantSkills }}
    </div>
  </div>

  <!-- DÉJÀ SCANNÉ -->
  <div *ngIf="state === 'already'"
       style="background:white;border-radius:24px;padding:2.5rem;
              text-align:center;max-width:400px;width:100%;
              box-shadow:0 40px 80px rgba(0,0,0,0.4);">
    <div style="font-size:4rem;margin-bottom:1rem;">⚠️</div>
    <div style="font-size:0.8rem;font-weight:700;color:#d97706;
                letter-spacing:2px;text-transform:uppercase;margin-bottom:0.5rem;">
      DÉJÀ ENREGISTRÉ
    </div>
    <h2 style="font-size:1.5rem;font-weight:800;color:#1f2937;margin:0 0 0.5rem;">
      {{ participantName }}
    </h2>
    <p style="font-size:0.85rem;color:#6b7280;margin:0;">
      Ce participant a déjà été scanné
    </p>
  </div>

  <!-- ERREUR -->
  <div *ngIf="state === 'error'"
       style="background:white;border-radius:24px;padding:2.5rem;
              text-align:center;max-width:400px;width:100%;
              box-shadow:0 40px 80px rgba(0,0,0,0.4);">
    <div style="font-size:4rem;margin-bottom:1rem;">❌</div>
    <div style="font-size:0.8rem;font-weight:700;color:#dc2626;
                letter-spacing:2px;text-transform:uppercase;margin-bottom:0.5rem;">
      PARTICIPANT INCONNU
    </div>
    <p style="font-size:0.9rem;color:#6b7280;margin:0;">
      {{ errorMessage }}
    </p>
  </div>

</div>
