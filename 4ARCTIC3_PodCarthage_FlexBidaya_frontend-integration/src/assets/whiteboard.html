<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{overflow:hidden;background:#f8f7f4;font-family:sans-serif}
    #toolbar{
      position:fixed;top:14px;left:50%;transform:translateX(-50%);
      background:white;
      border:0.5px solid #ddd;
      border-radius:12px;
      padding:8px 12px;
      display:flex;gap:6px;align-items:center;z-index:100;
      box-shadow:0 2px 16px rgba(0,0,0,0.08);
    }
    .sep{width:0.5px;height:28px;background:#ddd;margin:0 2px}
    .tool-btn{
      width:36px;height:36px;border:0.5px solid transparent;border-radius:8px;
      cursor:pointer;background:transparent;display:flex;align-items:center;justify-content:center;
      transition:background 0.15s,border-color 0.15s;
    }
    .tool-btn:hover{background:#f1f0ed}
    .tool-btn.active{background:#e6f1fb;border-color:#85b7eb}
    .tool-btn svg{width:18px;height:18px;stroke:#1a1a1a;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .tool-btn.active svg{stroke:#185fa5}
    #color-picker-wrap{position:relative;width:28px;height:28px}
    #color-preview{width:28px;height:28px;border-radius:6px;cursor:pointer;border:0.5px solid #ccc}
    #color-input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
    .size-wrap{display:flex;align-items:center;gap:6px}
    .size-wrap label,.op-label{font-size:12px;color:#888}
    #size-val,#op-val{font-size:12px;color:#888;min-width:20px}
    canvas{display:block;cursor:crosshair}
  </style>
</head>
<body>

<div id="toolbar">
  <button class="tool-btn active" id="btn-pen" title="Crayon" onclick="setTool('pen')">
    <svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
  </button>
  <button class="tool-btn" id="btn-brush" title="Pinceau doux" onclick="setTool('brush')">
    <svg viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
  </button>
  <button class="tool-btn" id="btn-highlight" title="Surligneur" onclick="setTool('highlight')">
    <svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
  </button>
  <button class="tool-btn" id="btn-line" title="Ligne" onclick="setTool('line')">
    <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/></svg>
  </button>
  <button class="tool-btn" id="btn-arrow" title="Flèche" onclick="setTool('arrow')">
    <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg>
  </button>
  <button class="tool-btn" id="btn-rect" title="Rectangle" onclick="setTool('rect')">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
  </button>
  <button class="tool-btn" id="btn-circle" title="Cercle" onclick="setTool('circle')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
  </button>
  <button class="tool-btn" id="btn-text" title="Texte" onclick="setTool('text')">
    <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
  </button>
  <button class="tool-btn" id="btn-eraser" title="Gomme" onclick="setTool('eraser')">
    <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
  </button>

  <div class="sep"></div>

  <div id="color-picker-wrap" title="Couleur">
    <div id="color-preview" style="background:#1e3a8a"></div>
    <input type="color" id="color-input" value="#1e3a8a" oninput="setColor(this.value)">
  </div>

  <div class="size-wrap">
    <label>Taille</label>
    <input type="range" min="1" max="30" value="4" step="1"
      oninput="size=+this.value;document.getElementById('size-val').textContent=this.value"
      style="width:64px;">
    <span id="size-val">4</span>
  </div>

  <div class="size-wrap">
    <label class="op-label">Opacité</label>
    <input type="range" min="10" max="100" value="100" step="5"
      oninput="opacity=+this.value/100;document.getElementById('op-val').textContent=this.value+'%'"
      style="width:54px;">
    <span id="op-val">100%</span>
  </div>

  <div class="sep"></div>

  <button class="tool-btn" title="Annuler (Ctrl+Z)" onclick="undo()">
    <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
  </button>
  <button class="tool-btn" title="Tout effacer" onclick="clearAll()">
    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
  </button>
</div>

<canvas id="wb"></canvas>

<script>
  const canvas = document.getElementById('wb');
  const ctx    = canvas.getContext('2d');
  let tool='pen', color='#1e3a8a', size=4, opacity=1;
  let drawing=false, startX=0, startY=0, lastX=0, lastY=0;
  let history=[], snapshot=null, textInput=null;

  function resize(){
    const d=canvas.toDataURL();
    canvas.width=window.innerWidth; canvas.height=window.innerHeight;
    const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0); img.src=d;
  }
  window.addEventListener('resize',resize);
  resize();

  function hexToRgba(hex,a){
    const r=parseInt(hex.slice(1,3),16);
    const g=parseInt(hex.slice(3,5),16);
    const b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function setTool(t){
    tool=t;
    document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
    const el=document.getElementById('btn-'+t);
    if(el) el.classList.add('active');
    canvas.style.cursor=t==='text'?'text':t==='eraser'?'cell':'crosshair';
    if(textInput){textInput.remove();textInput=null;}
  }

  function setColor(c){
    color=c;
    document.getElementById('color-preview').style.background=c;
  }

  function saveHistory(){
    history.push(canvas.toDataURL());
    if(history.length>40) history.shift();
  }

  function undo(){
    if(!history.length) return;
    const img=new Image();
    img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);autoSave();};
    img.src=history.pop();
  }

  function clearAll(){
    saveHistory();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    autoSave();
  }

  function getPos(e){
    const r=canvas.getBoundingClientRect();
    if(e.touches) return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};
    return{x:e.offsetX,y:e.offsetY};
  }

  function drawArrow(x1,y1,x2,y2){
    const angle=Math.atan2(y2-y1,x2-x1);
    const hw=Math.max(size*3,12);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-hw*Math.cos(angle-0.4),y2-hw*Math.sin(angle-0.4));
    ctx.lineTo(x2-hw*Math.cos(angle+0.4),y2-hw*Math.sin(angle+0.4));
    ctx.closePath();
    ctx.fillStyle=hexToRgba(color,opacity);
    ctx.fill();
  }

  canvas.addEventListener('mousedown',e=>{
    if(tool==='text'){placeText(e);return;}
    saveHistory(); drawing=true;
    const p=getPos(e); startX=lastX=p.x; startY=lastY=p.y;
    snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);
  });

  canvas.addEventListener('mousemove',e=>{
    if(!drawing) return;
    const p=getPos(e);
    ctx.globalAlpha=opacity;
    if(tool==='pen'){
      ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);
      ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.stroke();lastX=p.x;lastY=p.y;
    } else if(tool==='brush'){
      ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);
      ctx.strokeStyle=color;ctx.lineWidth=size*3;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.globalAlpha=opacity*0.4;
      ctx.stroke();lastX=p.x;lastY=p.y;
    } else if(tool==='highlight'){
      ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);
      ctx.strokeStyle=color;ctx.lineWidth=size*5;ctx.lineCap='square';
      ctx.globalAlpha=0.25;
      ctx.stroke();lastX=p.x;lastY=p.y;
    } else if(tool==='eraser'){
      ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);
      ctx.strokeStyle='#f8f7f4';ctx.lineWidth=size*4;ctx.lineCap='round';
      ctx.globalAlpha=1;
      ctx.stroke();lastX=p.x;lastY=p.y;
    } else {
      ctx.putImageData(snapshot,0,0);
      ctx.globalAlpha=opacity;
      ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';
      if(tool==='rect'){
        ctx.beginPath();ctx.strokeRect(startX,startY,p.x-startX,p.y-startY);
      } else if(tool==='circle'){
        const rx=(p.x-startX)/2,ry=(p.y-startY)/2;
        ctx.beginPath();ctx.ellipse(startX+rx,startY+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);
        ctx.stroke();
      } else if(tool==='line'){
        ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(p.x,p.y);ctx.stroke();
      } else if(tool==='arrow'){
        drawArrow(startX,startY,p.x,p.y);
      }
    }
    ctx.globalAlpha=1;
  });

  canvas.addEventListener('mouseup',()=>{drawing=false;autoSave();});
  canvas.addEventListener('mouseleave',()=>{drawing=false;});

  function placeText(e){
    const p=getPos(e);
    if(textInput){textInput.remove();textInput=null;}
    const inp=document.createElement('input');
    inp.type='text';
    const r=canvas.getBoundingClientRect();
    inp.style.cssText=`position:fixed;left:${p.x+r.left}px;top:${p.y+r.top-12}px;font-size:${Math.max(size*4,14)}px;color:${color};background:transparent;border:none;border-bottom:1px dashed ${color};outline:none;min-width:80px;z-index:200;font-family:sans-serif`;
    document.body.appendChild(inp);
    inp.focus();
    textInput=inp;
    inp.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'||ev.key==='Escape'){
        if(ev.key==='Enter'&&inp.value.trim()){
          saveHistory();
          ctx.font=`${Math.max(size*4,14)}px sans-serif`;
          ctx.fillStyle=hexToRgba(color,opacity);
          ctx.fillText(inp.value,p.x,p.y);
        }
        inp.remove();textInput=null;
      }
    });
  }

  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
  });

  function autoSave(){
    window.parent.postMessage({type:'WB_SAVE',dataUrl:canvas.toDataURL('image/png')},'*');
  }

  window.addEventListener('message',e=>{
    if(e.data?.type==='WB_LOAD'&&e.data.dataUrl){
      const img=new Image();
      img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);};
      img.src=e.data.dataUrl;
    }
    if(e.data?.type==='WB_GET') autoSave();
  });

  window.parent.postMessage({type:'WB_READY'},'*');
</script>
</body>
</html>
